<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>My Budget Tracker</title>
    
</head>
<body>

    <header class="site-header">
        <h1>Personal Budget & Expense Tracker</h1>
        <p>Track your income, expenses, and budget.</p>
    </header>

    <main>
        <section class="budget-summary">
            <h2>Budget Summary</h2>

            <div class="summary-card">
                <h3>Total Budget</h3>
                <p>$0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p>$0.00</p>
            </div>

            <div class="summary-card">
                <h3>Remaining</h3>
                <p>$0.00</p>
            </div>
        </section>

        <section class="add-expense">
            <h2>Add an Expense</h2>

            <form>
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name" name="expense-name">

                <label for="expense-amount">Amount</label>
                <input type="number" id="expense-amount" name="expense-amount">

                <label for="expense-category">Category</label>
                <select id="expense-category" name="expense-category">
                    <option value="">Select a category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="bills">Bills</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expense-list">
            <h2>Expenses</h2>

            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Example Expense</td>
                        <td>Food</td>
                        <td>$10.00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Personal Budget & Expense Tracker</p>
    </footer>

</body>
</html>
